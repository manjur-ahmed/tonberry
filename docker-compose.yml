services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tonberry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tonberry}
      POSTGRES_DB: ${POSTGRES_DB:-tonberry}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tonberry} -d ${POSTGRES_DB:-tonberry}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Dev-only DB browser UI, not part of the app. Confirms the postgres
  # container is reachable over the network before web/api/ml join the stack.
  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
