name: Deploy 101ai api

on:
  push:
    branches: [main]
    paths:
      - "101ai/api/**"
      - ".github/workflows/deploy-101ai-api.yml"
  workflow_dispatch: {}

permissions:
  id-token: write # required for OIDC — no stored AWS keys
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 101ai/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 101ai/api/package-lock.json

      - run: npm ci
      - run: npm run build

      # Runs before the code deploy below, so the schema is never behind
      # what the new Lambda code expects (that gap is what broke prod
      # sign-in — migrations had only ever been run manually against Neon).
      - name: Run database migrations
        run: npm run migration:run
        env:
          DATABASE_URL: ${{ secrets.AI101_DATABASE_URL }}

      # node_modules ships as a separate Lambda layer now (see
      # aws_lambda_layer_version.dependencies in backend_api.tf) instead of
      # being bundled into the function's own zip — the function package
      # below is just dist/, which is the real fix for cold starts (a 25MB
      # monolithic zip was one of the two contributors an audit found; the
      # other, provisioned concurrency, is a deliberate follow-up given its
      # ongoing per-GB-second cost).
      #
      # ORDERING NOTE: the layer itself is Terraform-managed, not deployed
      # by this workflow. `terraform apply` must attach a layer built from
      # the current package-lock.json before (or in the same rollout as) a
      # code deploy that excludes node_modules — otherwise the live
      # function is left missing its dependencies until the layer catches
      # up. Rebuilding the layer on every run keeps it simple and it's
      # cheap either way; only the version actually attached via
      # `terraform apply` takes effect.
      - name: Stage Lambda layer (production dependencies)
        run: |
          rm -rf .lambda-layer-build
          mkdir -p .lambda-layer-build/nodejs
          cp package.json package-lock.json .lambda-layer-build/nodejs/
          cd .lambda-layer-build/nodejs
          npm ci --omit=dev
          rm package.json package-lock.json

      - name: Zip Lambda layer
        run: cd .lambda-layer-build && zip -qr ../../infra/layer.zip .

      - name: Stage Lambda package (app code only)
        run: |
          rm -rf .lambda-build
          mkdir .lambda-build
          cp -r dist .lambda-build/

      - name: Zip Lambda package
        run: cd .lambda-build && zip -qr ../lambda.zip .

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AI101_GITHUB_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AI101_AWS_REGION }}

      - run: |
          aws lambda update-function-code \
            --function-name ${{ vars.AI101_LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://lambda.zip
