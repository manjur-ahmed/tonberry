name: Deploy 101ai api

on:
  push:
    branches: [main]
    paths:
      - "101ai/api/**"
      - ".github/workflows/deploy-101ai-api.yml"
  workflow_dispatch: {}

permissions:
  id-token: write # required for OIDC — no stored AWS keys
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 101ai/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 101ai/api/package-lock.json

      - run: npm ci
      - run: npm run build

      # Runs before the code deploy below, so the schema is never behind
      # what the new Lambda code expects (that gap is what broke prod
      # sign-in — migrations had only ever been run manually against Neon).
      - name: Run database migrations
        run: npm run migration:run
        env:
          DATABASE_URL: ${{ secrets.AI101_DATABASE_URL }}

      # Production-only node_modules, staged alongside dist/ — devDependencies
      # (typescript, jest, eslint, ...) would otherwise bloat the zip.
      - name: Stage Lambda package
        run: |
          rm -rf .lambda-build
          mkdir .lambda-build
          cp -r dist .lambda-build/
          cp package.json package-lock.json .lambda-build/
          cd .lambda-build
          npm ci --omit=dev
          rm package.json package-lock.json

      - name: Zip Lambda package
        run: cd .lambda-build && zip -qr ../lambda.zip .

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AI101_GITHUB_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AI101_AWS_REGION }}

      - run: |
          aws lambda update-function-code \
            --function-name ${{ vars.AI101_LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://lambda.zip
